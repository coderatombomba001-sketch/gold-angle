<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>XAU·ANGLE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;color:#c8d0dc;font-family:'Courier New',monospace;}

/* TOOLBAR */
#toolbar{
  position:fixed;top:0;left:0;right:0;
  height:48px;background:#131722;
  border-bottom:1px solid #1e2530;
  display:flex;align-items:center;
  padding:0 8px;gap:6px;
  z-index:100;overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
#toolbar::-webkit-scrollbar{display:none;}
.tb{
  flex-shrink:0;padding:5px 10px;
  border:none;border-radius:6px;
  font-family:'Courier New',monospace;
  font-size:11px;font-weight:bold;
  cursor:pointer;background:#1e2530;color:#c8d0dc;
  white-space:nowrap;
}
.tb.on{background:#00d4aa;color:#000;}
.tb.on-y{background:#f5a623;color:#000;}
.tb.red{background:#3d1520;color:#ff4d6d;border:1px solid #ff4d6d;}
.tb.gold{background:#3d3010;color:#f5a623;border:1px solid #f5a623;}
#divWrap{display:flex;align-items:center;gap:4px;flex-shrink:0;}
#divWrap label{font-size:10px;color:#666;}
#divInp{
  width:44px;padding:4px 5px;
  background:#1a1f28;border:1px solid #2a3540;
  border-radius:4px;color:#f5a623;
  font-family:'Courier New',monospace;font-size:11px;
}
#livePrice{font-size:12px;font-weight:bold;color:#00d4aa;margin-left:auto;flex-shrink:0;}

/* CHART */
#chartWrap{position:fixed;top:48px;left:0;right:0;bottom:0;}
#lwChart{width:100%;height:100%;}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

/* BOTTOM PANEL */
#panel{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(13,17,23,0.97);
  border-top:1px solid #1e2530;
  max-height:45vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  z-index:100;
  display:none;
}
#panel.open{display:block;}
#panelHead{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid #1e2530;
  position:sticky;top:0;background:#131722;
}
#panelHead span{font-size:11px;color:#f5a623;font-weight:bold;letter-spacing:1px;}
#panelClose{background:none;border:none;color:#888;font-size:18px;cursor:pointer;}
#ptList{padding:6px;}
.ptRow{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;margin-bottom:4px;
  background:#111827;border-radius:6px;
}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.ptNum{color:#888;font-size:10px;width:20px;}
.ptAng{color:#e2e8f0;font-weight:bold;font-size:11px;flex:1;}
.ptRat{color:#4d9fff;font-size:11px;}
.ptRaw{color:#666;font-size:9px;}
.ptDel{color:#ff4d6d;font-size:16px;padding:0 6px;cursor:pointer;background:none;border:none;}

/* STATUS */
#status{font-size:10px;color:#4a5568;flex-shrink:0;}

/* TOUCH HINT */
#hint{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  background:rgba(245,166,35,0.15);border:1px solid rgba(245,166,35,0.3);
  color:#f5a623;font-size:11px;padding:6px 14px;border-radius:20px;
  pointer-events:none;z-index:200;opacity:0;transition:opacity 0.3s;
}
#hint.show{opacity:1;}
</style>
</head>
<body>

<div id="toolbar">
  <button class="tb on-y" id="bNuqta">+ Nuqta</button>
  <button class="tb" id="bSiljit">Siljit</button>
  <button class="tb" id="bSnap">Snap</button>
  <button class="tb" id="bButun">Butun</button>
  <div id="divWrap"><label>Bo'l:</label><input id="divInp" type="number" placeholder="auto" step="0.5" min="0.5"></div>
  <button class="tb gold" id="bBest">★</button>
  <button class="tb" id="bPanel">☰</button>
  <button class="tb red" id="bClear">✕</button>
  <span id="livePrice">—</span>
  <span id="status">Yuklanmoqda...</span>
</div>

<div id="chartWrap">
  <div id="lwChart"></div>
  <canvas id="overlay"></canvas>
</div>

<div id="panel">
  <div id="panelHead">
    <span>LINIYALAR</span>
    <button id="panelClose">×</button>
  </div>
  <div id="ptList"></div>
</div>

<div id="hint"></div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
var API_KEY = '9ac1e69b425143119feb8b5394e77099';
var SYMBOL  = 'XAU/USD';
var INTERVAL= '1min';
var COLORS  = ['#f5a623','#00d4aa','#ff4d6d','#4d9fff','#b388ff','#ff9f43','#26de81'];
var TOL     = 0.4;

// STATE
var pts=[], cross=null;
var mode='nuqta', snapMode=false, intMode=false, divNum=null;
var dragTarget=null, dragType=null;
var angleK=null;

// CHART SETUP
var chartEl=document.getElementById('lwChart');
var chart=LightweightCharts.createChart(chartEl,{
  width:chartEl.offsetWidth, height:chartEl.offsetHeight,
  layout:{background:{color:'#0d1117'},textColor:'#c8d0dc'},
  grid:{vertLines:{color:'#141920'},horzLines:{color:'#141920'}},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  rightPriceScale:{borderColor:'#2a2e39'},
  timeScale:{borderColor:'#2a2e39',timeVisible:true,secondsVisible:false},
  handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
  handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true},
});
var series=chart.addCandlestickSeries({
  upColor:'#26de81',downColor:'#ff4d6d',
  borderUpColor:'#26de81',borderDownColor:'#ff4d6d',
  wickUpColor:'#26de81',wickDownColor:'#ff4d6d',
});

// OVERLAY
var cv=document.getElementById('overlay');
var ctx=cv.getContext('2d');
function resizeAll(){
  var w=chartEl.offsetWidth, h=chartEl.offsetHeight;
  chart.applyOptions({width:w,height:h});
  cv.width=w; cv.height=h;
  draw();
}
window.addEventListener('resize',resizeAll);

// COORDINATES
function pToY(p){return chart.priceToCoordinate(p);}
function yToP(y){return chart.coordinateToPrice(y);}
function tToX(t){return chart.timeScale().timeToCoordinate(t);}
function xToT(x){return chart.timeScale().coordinateToTime(x);}
function ptScr(p){
  var x=tToX(p.time), y=pToY(p.price);
  if(x===null||y===null)return null;
  return{x:x,y:y};
}
function cScr(){
  if(!cross)return null;
  var x=tToX(cross.time), y=pToY(cross.price);
  if(x===null||y===null)return null;
  return{x:x,y:y};
}

// ANGLE
function ensureK(){
  if(angleK!==null)return;
  if(!cross||!pts.length)return;
  for(var i=0;i<pts.length;i++){
    var ps=ptScr(pts[i]), cs=cScr();
    if(!ps||!cs)continue;
    var dxP=cs.x-ps.x, dyP=-(cs.y-ps.y);
    var dT=cross.time-pts[i].time;
    var dP=cross.price-pts[i].price;
    if(Math.abs(dxP)<0.001||Math.abs(dP)<0.000001||Math.abs(dT)<0.001)continue;
    angleK=(dyP*dT)/(dxP*dP);
    return;
  }
}
function rawAng(p){
  if(!cross||angleK===null)return null;
  var dT=cross.time-p.time, dP=cross.price-p.price;
  var dx=dT, dy=dP*angleK;
  var ang;
  if(Math.abs(dx)<0.0000001)ang=(dy>=0?90:-90);
  else{ang=Math.atan2(dy,dx)*180/Math.PI;}
  return parseFloat(ang.toFixed(2));
}
function getBestDiv(s){
  s=Math.abs(s); if(s<0.5)return 1;
  for(var d=20;d>=1;d--){
    var r=s/d, rnd=Math.round(r*2)/2;
    if(Math.abs(r-rnd)<0.08&&rnd>=0.5)return d;
  }
  return Math.round(s)||1;
}
function getEffDiv(){
  return divNum&&divNum>0?divNum:null;
}
function snapAng(a){
  if(!snapMode)return a;
  var sign=a<0?-1:1, ab=Math.abs(a);
  var div=getEffDiv();
  if(div){
    if(intMode){
      var si=Math.round(ab/div)*div, sh=Math.round(ab/div*2)/2*div;
      return sign*(Math.abs(ab-sh)<Math.abs(ab-si)?sh:si);
    }
    return sign*Math.round(ab/div)*div;
  }
  return sign*Math.round(ab*2)/2;
}
function getAng(p){
  if(p.angOverride!=null)return p.angOverride;
  var r=rawAng(p); if(r===null)return null;
  return snapAng(r);
}
function isDimmed(p){
  if(!snapMode)return false;
  var r=rawAng(p); if(r===null)return false;
  var div=getEffDiv(); if(!div)return false;
  var ab=Math.abs(r);
  var si=Math.round(ab/div)*div, sh=Math.round(ab/div*2)/2*div;
  var err=Math.min(Math.abs(ab-si),Math.abs(ab-sh));
  return err>TOL;
}
function calcRatios(){
  var div=getEffDiv();
  if(!div){
    var angs=pts.map(function(p){var a=getAng(p);return a!==null?Math.abs(a):null;}).filter(Boolean);
    if(!angs.length)return pts.map(function(){return null;});
    div=getBestDiv(Math.min.apply(null,angs));
  }
  if(!div)div=1;
  return pts.map(function(p){
    var a=getAng(p); if(a===null)return null;
    return parseFloat((Math.abs(a)/div).toFixed(2));
  });
}

// DRAW
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  var cs=cScr();
  if(!cs||!pts.length)return;
  ensureK();
  var ratios=calcRatios();

  pts.forEach(function(p,i){
    var ps=ptScr(p); if(!ps)return;
    var dim=isDimmed(p);
    var alpha=dim?0.18:1;
    var rgb=hexRgb(p.color);

    // Line
    var dx=cs.x-ps.x, dy=cs.y-ps.y, len=Math.sqrt(dx*dx+dy*dy);
    if(len>0){
      ctx.beginPath();ctx.moveTo(ps.x,ps.y);
      ctx.lineTo(ps.x+(dx/len)*5000,ps.y+(dy/len)*5000);
      ctx.strokeStyle='rgba('+rgb+','+alpha+')';
      ctx.lineWidth=dim?0.8:1.5;
      ctx.setLineDash(dim?[4,4]:[]);
      ctx.stroke();ctx.setLineDash([]);
    }

    // Dot
    ctx.beginPath();ctx.arc(ps.x,ps.y,5,0,Math.PI*2);
    ctx.fillStyle='rgba('+rgb+','+alpha+')';ctx.fill();

    // Angle label
    var ang=getAng(p);
    if(ang!==null){
      ctx.fillStyle=dim?'rgba(80,80,100,0.6)':'rgba(77,159,255,1)';
      ctx.font='bold 11px monospace';
      ctx.fillText((ang>0?'+':'')+ang.toFixed(1)+'° #'+(i+1),ps.x+8,ps.y-8);
    }

    // Ratio
    if(!dim&&ratios[i]!==null&&len>0){
      var lux=(cs.x-ps.x)/len, luy=(cs.y-ps.y)/len;
      ctx.fillStyle='rgba(77,159,255,0.9)';
      ctx.font='bold 11px monospace';
      ctx.fillText('x'+ratios[i], cs.x+lux*100+6, cs.y+luy*100-4);
    }
  });

  // Cross
  ctx.beginPath();ctx.arc(cs.x,cs.y,4,0,Math.PI*2);
  ctx.fillStyle='#f5a623';ctx.fill();

  updatePanel(ratios);
}

function hexRgb(hex){
  return parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16);
}

// PANEL
function updatePanel(ratios){
  var list=document.getElementById('ptList');
  list.innerHTML='';
  pts.forEach(function(p,i){
    var ang=getAng(p), r=rawAng(p);
    var row=document.createElement('div');row.className='ptRow';
    row.innerHTML=
      '<div class="dot" style="background:'+p.color+'"></div>'+
      '<span class="ptNum">#'+(i+1)+'</span>'+
      '<span class="ptAng">'+(ang!==null?(ang>0?'+':'')+ang.toFixed(1)+'°':'—')+'</span>'+
      '<span class="ptRat">'+(ratios&&ratios[i]!==null?'x'+ratios[i]:'')+'</span>'+
      '<span class="ptRaw">'+(r!==null?(r>0?'+':'')+r.toFixed(2)+'°':'')+'</span>'+
      '<button class="ptDel" data-i="'+i+'">×</button>';
    list.appendChild(row);
  });
  list.querySelectorAll('.ptDel').forEach(function(btn){
    btn.addEventListener('click',function(){
      pts.splice(parseInt(this.dataset.i),1);
      angleK=null; draw();
    });
  });
}

// FIND BEST CROSS
function findBestCross(){
  if(!cross||!pts.length)return;
  ensureK(); if(angleK===null)return;
  var cs=cScr(); if(!cs)return;
  var div=getEffDiv()||6;
  var bestX=cs.x,bestY=cs.y,bestScore=1e18;
  for(var dx=-60;dx<=60;dx+=3){
    for(var dy=-60;dy<=60;dy+=3){
      var tx=cs.x+dx,ty=cs.y+dy;
      var tT=xToT(tx),tP=yToP(ty);
      if(!tT||tP===null)continue;
      var totalErr=0,vc=0;
      pts.forEach(function(p){
        var dT=tT-p.time, dP=tP-p.price;
        var ddx=dT,ddy=dP*angleK;
        var ang=Math.abs(ddx)<0.0000001?(ddy>=0?90:-90):Math.atan2(ddy,ddx)*180/Math.PI;
        var ab=Math.abs(ang);
        var si=Math.round(ab/div)*div, sh=Math.round(ab/div*2)/2*div;
        var err=Math.min(Math.abs(ab-si),Math.abs(ab-sh));
        totalErr+=err*err; vc++;
      });
      if(!vc)continue;
      var dist=Math.sqrt(dx*dx+dy*dy);
      var score=totalErr+dist*0.05;
      if(score<bestScore){bestScore=score;bestX=tx;bestY=ty;}
    }
  }
  var nt=xToT(bestX),np=yToP(bestY);
  if(nt&&np!==null){cross.time=nt;cross.price=np;}
}

// HINT
function showHint(txt){
  var h=document.getElementById('hint');
  h.textContent=txt;h.classList.add('show');
  clearTimeout(h._t);h._t=setTimeout(function(){h.classList.remove('show');},1800);
}

// TOUCH / MOUSE EVENTS
cv.style.pointerEvents='auto';
var touchId=null;

function getPos(e){
  var rect=cv.getBoundingClientRect();
  var src=e.touches?e.touches[0]:e;
  return{x:src.clientX-rect.left, y:src.clientY-rect.top};
}

function distPt(ax,ay,bx,by){return Math.sqrt((ax-bx)*(ax-bx)+(ay-by)*(ay-by));}

function onStart(pos){
  if(mode==='siljit'){
    var cs=cScr();
    if(cs&&distPt(pos.x,pos.y,cs.x,cs.y)<24){dragTarget=cross;dragType='cross';return;}
    for(var i=0;i<pts.length;i++){
      var ps=ptScr(pts[i]);
      if(ps&&distPt(pos.x,pos.y,ps.x,ps.y)<20){dragTarget=pts[i];dragType='pt';return;}
    }
  }
  if(mode==='nuqta'&&pts.length<7){
    var t=xToT(pos.x), p=yToP(pos.y);
    if(!t||p===null)return;
    pts.push({price:p,time:t,color:COLORS[pts.length%7],angOverride:null});
    if(!cross){
      var ct=xToT(pos.x+60), cp=yToP(pos.y+30);
      cross={price:cp||p-2,time:ct||t};
    }
    angleK=null; draw();
    showHint('Nuqta #'+pts.length+' qo\'yildi');
  }
}

function onMove(pos){
  if(!dragTarget)return;
  var t=xToT(pos.x), p=yToP(pos.y);
  if(!t||p===null)return;
  dragTarget.price=p; dragTarget.time=t;
  draw();
}

function onEnd(){dragTarget=null;dragType=null;}

// Touch
cv.addEventListener('touchstart',function(e){
  if(e.touches.length>1)return;
  touchId=e.touches[0].identifier;
  onStart(getPos(e));
},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(dragTarget)e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===touchId){
      onMove({x:e.changedTouches[i].clientX-cv.getBoundingClientRect().left,
              y:e.changedTouches[i].clientY-cv.getBoundingClientRect().top});
      break;
    }
  }
},{passive:false});
cv.addEventListener('touchend',onEnd,{passive:true});

// Mouse
cv.addEventListener('mousedown',function(e){onStart(getPos(e));});
cv.addEventListener('mousemove',function(e){if(dragTarget)onMove(getPos(e));});
cv.addEventListener('mouseup',onEnd);

// Chart scale change -> redraw
chart.timeScale().subscribeVisibleTimeRangeChange(function(){draw();});
chart.subscribeCrosshairMove(function(){draw();});

// TOOLBAR
function setMode(m){
  mode=m;
  document.getElementById('bNuqta').className='tb'+(m==='nuqta'?' on-y':'');
  document.getElementById('bSiljit').className='tb'+(m==='siljit'?' on':'');
}
document.getElementById('bNuqta').addEventListener('click',function(){setMode(mode==='nuqta'?'':' nuqta'.trim());});
document.getElementById('bSiljit').addEventListener('click',function(){setMode(mode==='siljit'?'':'siljit');});
document.getElementById('bSnap').addEventListener('click',function(){
  snapMode=!snapMode;this.className='tb'+(snapMode?' on':'');draw();
});
document.getElementById('bButun').addEventListener('click',function(){
  intMode=!intMode;this.className='tb'+(intMode?' on-y':'');draw();
});
document.getElementById('bBest').addEventListener('click',function(){findBestCross();draw();showHint('Eng yaxshi joy topildi');});
document.getElementById('bPanel').addEventListener('click',function(){
  var p=document.getElementById('panel');
  p.classList.toggle('open');
});
document.getElementById('panelClose').addEventListener('click',function(){
  document.getElementById('panel').classList.remove('open');
});
document.getElementById('bClear').addEventListener('click',function(){
  pts=[];cross=null;angleK=null;
  divNum=null;document.getElementById('divInp').value='';
  draw();showHint('Tozalandi');
});
document.getElementById('divInp').addEventListener('change',function(){
  var v=parseFloat(this.value);
  divNum=isNaN(v)||v<=0?null:v;
  angleK=null; draw();
});

// DATA
function loadData(){
  document.getElementById('status').textContent='Yuklanmoqda...';
  fetch('https://api.twelvedata.com/time_series?symbol='+encodeURIComponent(SYMBOL)+'&interval='+INTERVAL+'&outputsize=200&apikey='+API_KEY+'&format=JSON')
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.values){document.getElementById('status').textContent='Xato';return;}
      var data=d.values.slice().reverse().map(function(v){
        return{time:Math.floor(new Date(v.datetime).getTime()/1000),
               open:+v.open,high:+v.high,low:+v.low,close:+v.close};
      });
      series.setData(data);
      chart.timeScale().fitContent();
      var last=data[data.length-1];
      document.getElementById('livePrice').textContent=last.close.toFixed(2);
      document.getElementById('status').textContent='✓';
      draw();
    }).catch(function(){document.getElementById('status').textContent='Xato';});
}

setInterval(function(){
  fetch('https://api.twelvedata.com/time_series?symbol='+encodeURIComponent(SYMBOL)+'&interval='+INTERVAL+'&outputsize=3&apikey='+API_KEY+'&format=JSON')
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.values)return;
      var v=d.values[0];
      var t=Math.floor(new Date(v.datetime).getTime()/1000);
      series.update({time:t,open:+v.open,high:+v.high,low:+v.low,close:+v.close});
      document.getElementById('livePrice').textContent=(+v.close).toFixed(2);
      draw();
    }).catch(function(){});
},60000);

resizeAll();
loadData();
</script>
</body>
</html>
