<html><head><meta charset="utf-8"><title>GOLD ANGLE</title></head><body style="background:#0a0e14;display:flex;align-items:center;justify-content:center;height:100vh;margin:0"><script>
var c=document.createElement('canvas');c.style.cssText='position:fixed;top:0;left:0;z-index:99999;pointer-events:none;';c.width=window.innerWidth;c.height=window.innerHeight;document.body.appendChild(c);var ctx=c.getContext('2d');var COLORS=["#f5a623","#00d4aa","#ff4d6d","#4d9fff","#b388ff"];var pts=[],cross=null,mode='point',dragTarget=null,rafId=null,preview=null;var FO=-40;function getPane(){return document.querySelector('.chart-container-border')||document.querySelector('.layout__area--center')||document.body;}function getPaneRect(){return getPane().getBoundingClientRect();}function toRel(sx,sy){var r=getPaneRect();return{rx:(sx-r.left)/Math.max(r.width,1),ry:(sy-r.top)/Math.max(r.height,1)};}function toScr(rel){var r=getPaneRect();return{x:r.left+rel.rx*r.width,y:r.top+rel.ry*r.height};}function getAng(p){if(p.override!=null)return p.override;if(!cross)return null;var ps=toScr(p.rel),cs=toScr(cross.rel);return parseFloat((Math.atan2(-(cs.y-ps.y),(cs.x-ps.x))*180/Math.PI).toFixed(2));}
var pn=document.createElement('div');pn.style.cssText='position:fixed;top:60px;right:10px;width:180px;background:rgba(8,10,14,0.97);border:1px solid #2a3540;border-radius:8px;font-family:monospace;color:#c8d0dc;z-index:100000;user-select:none;';function mkBtn(t,cs){var b=document.createElement('button');b.textContent=t;b.style.cssText=cs+'font-family:monospace;cursor:pointer;border-radius:3px;';return b;}var bp=mkBtn('+Nuqta','flex:1;padding:6px 4px;border:1px solid #f5a623;background:#f5a623;color:#000;font-size:10px;font-weight:700;');var bc=mkBtn('Sur','flex:1;padding:6px 4px;border:1px solid #555;background:transparent;color:#c8d0dc;font-size:10px;');var be=mkBtn('Ochir','flex:1;padding:6px 4px;border:1px solid #b388ff;background:transparent;color:#b388ff;font-size:10px;');var bx=mkBtn('X','padding:6px 8px;border:1px solid #ff4d6d;background:transparent;color:#ff4d6d;font-size:10px;');var brow=document.createElement('div');brow.style.cssText='padding:6px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:3px;border-bottom:1px solid #1e2530;';brow.appendChild(bp);brow.appendChild(bc);brow.appendChild(be);brow.appendChild(bx);var list=document.createElement('div');list.style.cssText='padding:6px;font-size:10px;min-height:20px;';var bcl=mkBtn('Yopish','width:100%;padding:6px;border:1px solid #ff4d6d;background:transparent;color:#ff4d6d;font-size:10px;');var ftr=document.createElement('div');ftr.style.cssText='padding:6px;border-top:1px solid #1e2530;';ftr.appendChild(bcl);pn.appendChild(brow);pn.appendChild(list);pn.appendChild(ftr);document.body.appendChild(pn);
function drawAll(){c.width=window.innerWidth;c.height=window.innerHeight;ctx.clearRect(0,0,c.width,c.height);var cs=cross?toScr(cross.rel):null;pts.forEach(function(p,i){var ps=toScr(p.rel);if(cs){var dx=cs.x-ps.x,dy=cs.y-ps.y,len=Math.sqrt(dx*dx+dy*dy);if(len>1){var ux=dx/len,uy=dy/len;ctx.beginPath();ctx.moveTo(ps.x-ux*5000,ps.y-uy*5000);ctx.lineTo(cs.x+ux*5000,cs.y+uy*5000);ctx.strokeStyle=p.c;ctx.lineWidth=1.2;ctx.stroke();}}ctx.beginPath();ctx.arc(ps.x,ps.y,6,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();var a=getAng(p);if(a!==null){var aStr=(a>0?'+':'')+a.toFixed(2)+'°';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillStyle=p.c;ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=3;var tx=ps.x+(cs.x-ps.x)*0.25,ty=ps.y+(cs.y-ps.y)*0.25-12;ctx.strokeText(aStr,tx,ty);ctx.fillText(aStr,tx,ty);}});if(cs){ctx.beginPath();ctx.arc(cs.x,cs.y,7,0,Math.PI*2);ctx.strokeStyle='#f5a623';ctx.lineWidth=2;ctx.stroke();}if(preview){ctx.beginPath();ctx.arc(preview.x,preview.y,8,0,Math.PI*2);ctx.fillStyle='rgba(245,166,35,0.4)';ctx.fill();ctx.strokeStyle='#f5a623';ctx.lineWidth=2;ctx.stroke();}updList();}function updList(){list.innerHTML='';if(!pts.length){list.innerHTML='<div style="color:#4a5568;font-size:9px">Grafik ustiga suring</div>';return;}pts.forEach(function(p,i){var a=getAng(p),col=a===null?'#888':a>=0?'#00d4aa':'#ff4d6d';var d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:4px;padding:2px 0;';d.innerHTML='<span style="width:7px;height:7px;border-radius:50%;background:'+p.c+';display:inline-block"></span><span style="flex:1;font-size:9px">#'+(i+1)+'</span><span style="color:'+col+';font-size:10px;font-weight:700">'+(a===null?'—':(a>0?'+':'')+a.toFixed(2)+'°')+'</span>';list.appendChild(d);});}function loop(){drawAll();rafId=requestAnimationFrame(loop);}loop();
var tActive=false,tType=null,tIdx=-1;document.addEventListener('touchstart',function(e){if(pn.contains(e.target))return;e.preventDefault();var t=e.touches[0],cx=t.clientX,cy=t.clientY,ry=cy+FO;tActive=true;tType=null;if(cross&&mode==='cross'){var cs=toScr(cross.rel);if(Math.sqrt(Math.pow(cx-cs.x,2)+Math.pow(cy-cs.y,2))<40){tType='cross';preview={x:cx,y:ry};return;}}if(mode!=='erase'){for(var i=0;i<pts.length;i++){var ps=toScr(pts[i].rel);if(Math.sqrt(Math.pow(cx-ps.x,2)+Math.pow(cy-ps.y,2))<30){tType='pt';tIdx=i;preview={x:cx,y:ry};return;}}}if(mode==='erase'){tType='erase';preview={x:cx,y:cy};return;}if(mode==='point'&&pts.length<5){tType='new';preview={x:cx,y:ry};}},{passive:false});document.addEventListener('touchmove',function(e){if(pn.contains(e.target))return;if(!tActive||!tType)return;e.preventDefault();var t=e.touches[0],cx=t.clientX,cy=t.clientY,ry=cy+FO;preview={x:cx,y:ry};if(tType==='cross')cross.rel=toRel(cx,ry);else if(tType==='pt')pts[tIdx].rel=toRel(cx,ry);},{passive:false});document.addEventListener('touchend',function(e){if(pn.contains(e.target))return;if(!tActive)return;var t=e.changedTouches[0],cx=t.clientX,cy=t.clientY;if(tType==='new'&&preview){pts.push({rel:toRel(preview.x,preview.y),c:COLORS[pts.length%5],override:null});if(!cross)cross={rel:toRel(preview.x+100,preview.y-60)};}else if(tType==='erase'){for(var i=0;i<pts.length;i++){var ps=toScr(pts[i].rel);if(Math.sqrt(Math.pow(cx-ps.x,2)+Math.pow(cy-ps.y,2))<28){pts.splice(i,1);break;}}}preview=null;tActive=false;tType=null;tIdx=-1;},{passive:true});
bp.addEventListener('click',function(e){e.stopPropagation();mode='point';bp.style.background='#f5a623';bp.style.color='#000';bc.style.background='transparent';bc.style.color='#c8d0dc';be.style.background='transparent';});bc.addEventListener('click',function(e){e.stopPropagation();mode='cross';bc.style.background='#f5a623';bc.style.color='#000';bp.style.background='transparent';bp.style.color='#c8d0dc';be.style.background='transparent';if(!cross&&pts.length){var ps=toScr(pts[0].rel);cross={rel:toRel(ps.x+100,ps.y-60)};}});be.addEventListener('click',function(e){e.stopPropagation();mode='erase';be.style.background='#b388ff';be.style.color='#000';bp.style.background='transparent';bp.style.color='#c8d0dc';bc.style.background='transparent';bc.style.color='#c8d0dc';});bx.addEventListener('click',function(e){e.stopPropagation();pts=[];cross=null;});bcl.addEventListener('click',function(e){e.stopPropagation();cancelAnimationFrame(rafId);c.remove();pn.remove();});window.__ga={close:function(){cancelAnimationFrame(rafId);c.remove();pn.remove();}};
</script></body></html>
